name: Verify game and sprite engine
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/compile-gecko-art.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Three browser partitions cover every case once, in separate artifact dirs.
      # Check cross-font layout first so a regression fails before the long suite.
      - run: npm run test:e2e -- e2e/gen-family-popup.spec.ts --workers=2 --grep "full lineage tab retains" --output=test-results/lineage-layout
      # Real-time Rush frame/tap measurements need an uncontended browser.
      - run: npm run test:e2e -- --workers=2 --grep-invert "rush|full lineage tab retains" --output=test-results/functional
      - run: npm run test:e2e -- --workers=1 --grep rush --output=test-results/rush
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
