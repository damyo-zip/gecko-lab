name: Verify game and sprite engine
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/compile-gecko-art.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Real-time Rush frame/tap measurements need an uncontended browser.
      # Both commands together run every case; no performance test is omitted.
      - run: npm run test:e2e -- --workers=2 --grep-invert rush --output=test-results/functional
      - run: npm run test:e2e -- --workers=1 --grep rush --output=test-results/rush
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
